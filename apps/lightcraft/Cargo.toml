[package]
name = "lightcraft"
description = "LightCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "lightcraft"

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true, features = ["sam"] }
lightcraft-ui-martensite = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
# Icon + VERSIONINFO for lightcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/lightcraft", dest = "/usr/bin/lightcraft", mode = "755" }
]
